name: Apply SharePoint settings UI

on:
  push:
    paths:
      - '.github/workflows/apply-sharepoint-settings-ui.yml'

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Make Shared Data Connection editable
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f'Could not find expected {label} block')
              text = text.replace(old, new, 1)

          css_anchor = '''    .connection-placeholder{padding:9px 10px;border-left:4px solid var(--blue);border-radius:7px;background:var(--blue-soft);font-size:11px;line-height:1.45;color:var(--ink)}'''
          css_new = css_anchor + '''\n    .connection-form{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n    .connection-form .field{margin:0}\n    .connection-form .field.full{grid-column:1/-1}\n    .connection-form input{width:100%;height:39px;border:1px solid var(--border-strong);border-radius:7px;padding:7px 9px;background:var(--surface);color:var(--ink)}\n    .connection-form input[readonly]{background:var(--canvas);color:var(--muted)}\n    .connection-toggle{display:flex;align-items:flex-start;gap:9px;padding:10px 11px;border:1px solid var(--border);border-radius:8px;background:var(--canvas);font-size:11px;line-height:1.4;color:var(--ink)}\n    .connection-toggle input{margin-top:2px}\n    .connection-security-note{padding:9px 10px;border-left:4px solid var(--green);border-radius:7px;background:var(--green-bg);font-size:11px;line-height:1.45;color:var(--ink)}\n    @media(max-width:650px){.connection-form{grid-template-columns:1fr}.connection-form .field.full{grid-column:auto}}'''
          replace_once(css_anchor, css_new, 'connection CSS')

          old_html = '''            <div class="connection-list">\n              <div class="connection-list-item"><b>Daily queue list</b><span>Outcomes Ops Dashboard</span></div>\n              <div class="connection-list-item"><b>Weekly performance list</b><span>Outcomes Weekly Performance</span></div>\n              <div class="connection-list-item"><b>Redirect address</b><span>https://onikamathews-beep.github.io/outcomes-ops-dashboard/</span></div>\n            </div>\n            <div class="connection-placeholder">The Client ID and Tenant ID are not passwords. After IAM supplies them, they can be placed in the connection configuration and tested before shared saving is turned on.</div>\n            <div class="settings-actions">\n              <button class="btn btn-secondary full" id="checkSharePointBtn" type="button">Check SharePoint readiness</button>\n              <button class="btn btn-secondary" id="microsoftSignInBtn" type="button" disabled>Sign in to Microsoft</button>\n              <button class="btn btn-primary" id="transferToSharePointBtn" type="button" disabled>Transfer browser data</button>\n            </div>'''
          new_html = '''            <div class="connection-form">\n              <label class="field">\n                <span>Application (Client) ID</span>\n                <input id="sharePointClientIdInput" type="text" autocomplete="off" placeholder="Enter the Entra Application (Client) ID">\n                <small>Provided by the Entra/IAM team or your App Registration.</small>\n              </label>\n              <label class="field">\n                <span>Tenant ID</span>\n                <input id="sharePointTenantIdInput" type="text" autocomplete="off" placeholder="Enter the Microsoft Entra Tenant ID">\n                <small>The directory/tenant identifier for McKesson.</small>\n              </label>\n              <label class="field">\n                <span>SharePoint host</span>\n                <input id="sharePointHostInput" type="text" autocomplete="off" placeholder="https://...sharepoint.com">\n              </label>\n              <label class="field">\n                <span>SharePoint site path</span>\n                <input id="sharePointSitePathInput" type="text" autocomplete="off" placeholder="/sites/... or /personal/...">\n              </label>\n              <label class="field">\n                <span>Daily queue list</span>\n                <input id="sharePointQueueListInput" type="text" autocomplete="off">\n              </label>\n              <label class="field">\n                <span>Weekly performance list</span>\n                <input id="sharePointWeeklyListInput" type="text" autocomplete="off">\n              </label>\n              <label class="field full">\n                <span>Redirect address</span>\n                <input id="sharePointRedirectInput" type="text" readonly>\n                <small>This exact address should be registered as the SPA redirect URI in Entra.</small>\n              </label>\n            </div>\n            <label class="connection-toggle"><input id="sharePointEnabledInput" type="checkbox"> <span><b>Enable SharePoint connection for testing</b><br>Browser storage remains available while the Microsoft connection is being tested.</span></label>\n            <div class="connection-security-note"><b>No client secret is stored here.</b> This dashboard is a browser app and is staged for delegated Microsoft sign-in. Client ID and Tenant ID are identifiers, not passwords.</div>\n            <div class="connection-placeholder">Enter the registration details above, save them, then use <b>Check SharePoint readiness</b>. Microsoft sign-in and shared saving remain staged until authentication and list access are successfully tested.</div>\n            <div class="settings-actions">\n              <button class="btn btn-primary full" id="saveSharePointConnectionBtn" type="button">Save connection settings</button>\n              <button class="btn btn-secondary full" id="checkSharePointBtn" type="button">Check SharePoint readiness</button>\n              <button class="btn btn-secondary" id="microsoftSignInBtn" type="button" disabled>Sign in to Microsoft</button>\n              <button class="btn btn-primary" id="transferToSharePointBtn" type="button" disabled>Transfer browser data</button>\n            </div>'''
          replace_once(old_html, new_html, 'Shared Data Connection HTML')

          old_keys = '''    const STORE_KEY = 'pinapple.dashboard.records';\n    const META_KEY = 'pinapple.dashboard.meta';\n    const APPEARANCE_KEY = 'pinapple.dashboard.appearance';'''
          new_keys = old_keys + "\n    const SHAREPOINT_CONFIG_KEY = 'pinapple.dashboard.sharepointConfig';"
          replace_once(old_keys, new_keys, 'storage keys')

          old_js = '''    // SharePoint staging configuration. Browser mode remains active until IAM supplies\n    // the Client ID and Tenant ID and the connection is deliberately enabled.\n    const SHAREPOINT_CONFIG = Object.freeze({\n      enabled:false,\n      clientId:'',\n      tenantId:'',\n      redirectUri:'https://onikamathews-beep.github.io/outcomes-ops-dashboard/',\n      sharePointHost:'https://mckessoncorp-my.sharepoint.com',\n      sitePath:'/personal/onika_mathews_mckesson_com',\n      queueListName:'Outcomes Ops Dashboard',\n      weeklyListName:'Outcomes Weekly Performance'\n    });\n\n    function sharePointConfigurationReady(){\n      return Boolean(\n        SHAREPOINT_CONFIG.enabled &&\n        SHAREPOINT_CONFIG.clientId.trim() &&\n        SHAREPOINT_CONFIG.tenantId.trim() &&\n        SHAREPOINT_CONFIG.redirectUri.trim() &&\n        SHAREPOINT_CONFIG.sitePath.trim()\n      );\n    }\n\n    function updateConnectionUi(){\n      const ready=sharePointConfigurationReady();\n      const modeText=$('dataModeText');\n      const dot=$('connectionDot');\n      const badge=$('sharePointStatusBadge');\n      const detail=$('sharePointStatusDetail');\n      const signIn=$('microsoftSignInBtn');\n      const transfer=$('transferToSharePointBtn');\n      if(modeText)modeText.textContent=ready?'SharePoint ready':'Browser mode';\n      if(dot)dot.classList.toggle('waiting',!ready);\n      if(badge){badge.textContent=ready?'Ready to test':'Waiting for IAM';badge.classList.toggle('waiting',!ready);}\n      if(detail)detail.textContent=ready?'Registration details are present. Sign-in and list access still require a successful connection test.':'Waiting for the Microsoft Entra Client ID and Tenant ID.';\n      if(signIn)signIn.disabled=!ready;\n      if(transfer)transfer.disabled=true;\n    }\n\n    function checkSharePointReadiness(){\n      const missing=[];\n      if(!SHAREPOINT_CONFIG.clientId.trim())missing.push('Client ID');\n      if(!SHAREPOINT_CONFIG.tenantId.trim())missing.push('Tenant ID');\n      if(!SHAREPOINT_CONFIG.enabled)missing.push('connection enablement');\n      if(missing.length){\n        toast(`Browser mode is active. SharePoint is waiting for ${missing.join(', ')}.`,'warn');\n        return false;\n      }\n      toast('SharePoint configuration is present and ready for a sign-in test. Browser saving is still active.','success');\n      return true;\n    }'''
          new_js = '''    // SharePoint staging configuration. These values are identifiers and connection\n    // settings only; no client secret is stored in this browser application.\n    const SHAREPOINT_DEFAULTS = Object.freeze({\n      enabled:false,\n      clientId:'',\n      tenantId:'',\n      redirectUri:'https://onikamathews-beep.github.io/Outcomes-Ops-Dashboard/',\n      sharePointHost:'https://mckessoncorp-my.sharepoint.com',\n      sitePath:'/personal/onika_mathews_mckesson_com',\n      queueListName:'Outcomes Ops Dashboard',\n      weeklyListName:'Outcomes Weekly Performance'\n    });\n\n    function loadSharePointConfig(){\n      try{\n        const saved=JSON.parse(localStorage.getItem(SHAREPOINT_CONFIG_KEY)||'null');\n        return {\n          ...SHAREPOINT_DEFAULTS,\n          ...(saved&&typeof saved==='object'?saved:{}),\n          redirectUri:SHAREPOINT_DEFAULTS.redirectUri\n        };\n      }catch(error){\n        return {...SHAREPOINT_DEFAULTS};\n      }\n    }\n\n    let SHAREPOINT_CONFIG=loadSharePointConfig();\n\n    function populateSharePointSettings(){\n      if(!$('sharePointClientIdInput'))return;\n      $('sharePointClientIdInput').value=SHAREPOINT_CONFIG.clientId||'';\n      $('sharePointTenantIdInput').value=SHAREPOINT_CONFIG.tenantId||'';\n      $('sharePointHostInput').value=SHAREPOINT_CONFIG.sharePointHost||'';\n      $('sharePointSitePathInput').value=SHAREPOINT_CONFIG.sitePath||'';\n      $('sharePointQueueListInput').value=SHAREPOINT_CONFIG.queueListName||'';\n      $('sharePointWeeklyListInput').value=SHAREPOINT_CONFIG.weeklyListName||'';\n      $('sharePointRedirectInput').value=SHAREPOINT_DEFAULTS.redirectUri;\n      $('sharePointEnabledInput').checked=Boolean(SHAREPOINT_CONFIG.enabled);\n    }\n\n    function saveSharePointConnection(){\n      SHAREPOINT_CONFIG={\n        enabled:Boolean($('sharePointEnabledInput').checked),\n        clientId:$('sharePointClientIdInput').value.trim(),\n        tenantId:$('sharePointTenantIdInput').value.trim(),\n        redirectUri:SHAREPOINT_DEFAULTS.redirectUri,\n        sharePointHost:$('sharePointHostInput').value.trim(),\n        sitePath:$('sharePointSitePathInput').value.trim(),\n        queueListName:$('sharePointQueueListInput').value.trim(),\n        weeklyListName:$('sharePointWeeklyListInput').value.trim()\n      };\n      localStorage.setItem(SHAREPOINT_CONFIG_KEY,JSON.stringify(SHAREPOINT_CONFIG));\n      populateSharePointSettings();\n      updateConnectionUi();\n      toast('SharePoint connection settings saved in this browser.','success');\n    }\n\n    function sharePointConfigurationReady(){\n      return Boolean(\n        SHAREPOINT_CONFIG.enabled &&\n        SHAREPOINT_CONFIG.clientId.trim() &&\n        SHAREPOINT_CONFIG.tenantId.trim() &&\n        SHAREPOINT_CONFIG.redirectUri.trim() &&\n        SHAREPOINT_CONFIG.sharePointHost.trim() &&\n        SHAREPOINT_CONFIG.sitePath.trim() &&\n        SHAREPOINT_CONFIG.queueListName.trim() &&\n        SHAREPOINT_CONFIG.weeklyListName.trim()\n      );\n    }\n\n    function updateConnectionUi(){\n      const ready=sharePointConfigurationReady();\n      const hasRegistration=Boolean(SHAREPOINT_CONFIG.clientId.trim()&&SHAREPOINT_CONFIG.tenantId.trim());\n      const modeText=$('dataModeText');\n      const dot=$('connectionDot');\n      const badge=$('sharePointStatusBadge');\n      const detail=$('sharePointStatusDetail');\n      const signIn=$('microsoftSignInBtn');\n      const transfer=$('transferToSharePointBtn');\n      if(modeText)modeText.textContent=ready?'SharePoint ready':'Browser mode';\n      if(dot)dot.classList.toggle('waiting',!ready);\n      if(badge){\n        badge.textContent=ready?'Ready to test':hasRegistration?'Saved / disabled':'Waiting for IAM';\n        badge.classList.toggle('waiting',!ready);\n      }\n      if(detail){\n        detail.textContent=ready\n          ?'Registration details are saved. Sign-in and list access still require a successful connection test.'\n          :hasRegistration\n            ?'Client ID and Tenant ID are saved. Enable the connection when you are ready to test.'\n            :'Waiting for the Microsoft Entra Client ID and Tenant ID.';\n      }\n      if(signIn)signIn.disabled=!ready;\n      if(transfer)transfer.disabled=true;\n    }\n\n    function checkSharePointReadiness(){\n      const missing=[];\n      if(!SHAREPOINT_CONFIG.clientId.trim())missing.push('Client ID');\n      if(!SHAREPOINT_CONFIG.tenantId.trim())missing.push('Tenant ID');\n      if(!SHAREPOINT_CONFIG.sharePointHost.trim())missing.push('SharePoint host');\n      if(!SHAREPOINT_CONFIG.sitePath.trim())missing.push('site path');\n      if(!SHAREPOINT_CONFIG.queueListName.trim())missing.push('daily queue list');\n      if(!SHAREPOINT_CONFIG.weeklyListName.trim())missing.push('weekly performance list');\n      if(!SHAREPOINT_CONFIG.enabled)missing.push('connection enablement');\n      if(missing.length){\n        toast(`SharePoint is waiting for ${missing.join(', ')}.`,'warn');\n        return false;\n      }\n      toast('Connection settings are complete and ready for a Microsoft sign-in test. Browser saving is still active.','success');\n      return true;\n    }'''
          replace_once(old_js, new_js, 'SharePoint JavaScript')

          old_open = '''    function openSettings(){\n      populateCustomInputs(activeCustomVars(appearanceState));'''
          new_open = '''    function openSettings(){\n      populateSharePointSettings();\n      updateConnectionUi();\n      populateCustomInputs(activeCustomVars(appearanceState));'''
          replace_once(old_open, new_open, 'openSettings')

          old_events = '''      $('checkSharePointBtn').onclick=checkSharePointReadiness;\n      $('microsoftSignInBtn').onclick=()=>{if(checkSharePointReadiness())toast('Microsoft sign-in will be activated during the IAM connection update.','info');};'''
          new_events = '''      $('saveSharePointConnectionBtn').onclick=saveSharePointConnection;\n      $('checkSharePointBtn').onclick=checkSharePointReadiness;\n      $('microsoftSignInBtn').onclick=()=>{if(checkSharePointReadiness())toast('Microsoft sign-in will be activated during the IAM connection update.','info');};'''
          replace_once(old_events, new_events, 'SharePoint event wiring')

          old_startup = '''    applyAppearance(appearanceState,false);normalizeSaturdayCheckpointData();ensureTodayRows();ensureIphWeeklySlot();setDefaultDates();setIphDates();wireEvents();updateConnectionUi();render();'''
          new_startup = '''    applyAppearance(appearanceState,false);normalizeSaturdayCheckpointData();ensureTodayRows();ensureIphWeeklySlot();setDefaultDates();setIphDates();wireEvents();populateSharePointSettings();updateConnectionUi();render();'''
          replace_once(old_startup, new_startup, 'startup')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make SharePoint connection settings editable"
          git push origin main
